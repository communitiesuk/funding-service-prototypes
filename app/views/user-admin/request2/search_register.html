{% extends "layouts/access.html" %}

{% set showBackLink = true %}

{% set pageSize = "xl" %}
{% set pageHeading = "Search Companies House register" %}
{% set pageSection = "" %}
{% block pageTitle %}{{ macroPageTitle.pageTitle(pageHeading) }}{% endblock %}

{% block content %}
<div class="govuk-grid-row">
  <div class="govuk-grid-column-two-thirds">

    <form action="#" method="post" novalidate>
      
      <div class="govuk-form-group">
        <h1 class="govuk-label-wrapper">
          <label class="govuk-label govuk-label--l" for="company-search">
            Search Companies House register
          </label>
        </h1>
        
        <input class="govuk-input" id="company-search" name="companySearch" type="text" placeholder="Search by company name or number">
      </div>

      <button type="submit" class="govuk-button" data-module="govuk-button">
        Search
      </button>
      
    </form>

  </div>
</div>
{% endblock %}
